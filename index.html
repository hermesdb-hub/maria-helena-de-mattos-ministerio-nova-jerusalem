  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 215, 100, .20), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(100, 180, 255, .18), transparent 35%),
        linear-gradient(145deg, #111827 0%, #182b49 48%, #0b1220 100%);
      display: flex;
      justify-content: center;
      padding: 36px 18px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .brand {
      margin: 0 auto 22px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8c66b, #9f7624);
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      font-size: 38px;
      font-weight: 700;
      color: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 38px);
      line-height: 1.12;
      font-weight: 800;
    }

    .ministry {
      margin-top: 8px;
      font-size: 17px;
      letter-spacing: .4px;
      opacity: .86;
    }

    .call {
      margin: 26px 0 24px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      background: rgba(255,255,255,.09);
      backdrop-filter: blur(8px);
      font-size: 18px;
      line-height: 1.45;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      gap: 13px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 14px 20px;
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 7px 20px rgba(0,0,0,.18);
      transition: transform .18s ease, background .18s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.20);
    }

    .icon {
      width: 30px;
      margin-right: 10px;
      font-size: 21px;
    }

    .footer {
      margin-top: 26px;
      font-size: 13px;
      opacity: .55;
    }
  </style>
